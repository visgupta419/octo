[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxgraph"
version = "0.1.0"
description = "Git-native context layer for coding agents: ingest a repo and its docs, serve bounded context packs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ctxgraph = "ctxgraph.cli:main"

[tool.setuptools.packages.find]
include = ["ctxgraph*"]

[tool.setuptools.package-data]
"ctxgraph.store" = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
