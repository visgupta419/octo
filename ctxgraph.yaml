# ctxgraph indexing itself. Run `ctxgraph ingest` then `ctxgraph query "..."`.
version: 1
repo_root: .
db_path: .ctxgraph/index.db
budget_tokens_default: 4000

sources:
  - id: design
    type: markdown
    bucket: expertise
    paths: ["docs/DESIGN.md"]

  - id: docs
    type: markdown
    bucket: knowledge
    paths: ["**/*.md"]

  - id: code
    type: code
    bucket: knowledge
    paths: ["ctxgraph/**/*.py", "tests/**/*.py"]
